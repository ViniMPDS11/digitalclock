<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">

    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="android-chrome" sizes="192x192" href="assets/images/android-chrome-192x192.png">
    <link rel="android-chrome" sizes="512x512" href="assets/images/android-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">

    <title>Relógio Digital</title>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="hoursContainer">
                <h1 class="hoursText"></h1>
            </div>
            <div class="dateDisplay">
                <div class="dateContainer">
                    <div class="dayContainer displayContainer">
                        <p class="displayText">DAY</p>
                        <p class="dayText displayContentText"></p>
                    </div>
                    <div class="mouthContainer displayContainer">
                        <p class="displayText">MOUTH</p>
                        <p class="mouthText displayContentText"></p>
                    </div>
                </div>
                <div class="yearContainer displayContainer">
                    <p class="displayText">YEAR</p>
                    <p class="yearText displayContentText"></p>
                </div>
                <div class="secondsContainer displayContainer">
                    <p class="displayText">SECONDS</p>
                    <p class="secondsText displayContentText"></p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
